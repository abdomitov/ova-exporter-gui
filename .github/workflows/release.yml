name: CI/CD
# Push to main -> tests -> (new version only) build Windows and macOS, verify and publish. Nothing to click.
# To ship a release: raise VERSION (python tools/bump_version.py X.Y.Z), merge to main.
# Pushes that keep the same version only run the tests. Pull requests are covered by offline-tests.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    name: Is this a new version?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_artifacts.py plan
  validate:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/offline_tests.py
      - run: python tools/preview_ui.py --check
  build:
    name: Build and test the installer
    needs: [plan, validate]
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run supported-current Python regressions
        run: python tools/offline_tests.py
      - name: Audit the resolved Windows build environment
        shell: pwsh
        run: |
          python -m pip install pip-audit==2.10.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip_audit --progress-spinner off
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          python -m pip freeze > artifacts/ci/build-packages.txt
      - name: Install verified compiler on the ephemeral runner
        shell: pwsh
        run: .\tools\ci_compiler.ps1
      - name: Build app and installer
        shell: pwsh
        run: .\tools\build_windows.ps1 -Python python -Iscc "$env:OVA_ISCC"
      - name: Check the frozen app with fake data
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'artifacts/ci/frozen-check.json'
          $process = Start-Process -FilePath "$PWD/dist/OVAExporterGUI/OVAExporterGUI.exe" -ArgumentList @('--self-test-report',('"'+$report+'"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Frozen self-test failed' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.fake_ui_check -ne 'passed') { throw 'Frozen self-test did not pass' }
      - name: Check real install, upgrade, reopen and uninstall on the fresh runner
        run: python tools/ci_installer_check.py
      - name: Package and verify the release files
        run: |
          python tools/package_source.py
          python tools/release_artifacts.py verify-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*-Setup.exe
            dist/*-Setup.exe.sha256
            dist/*-source.zip
            dist/*-source.zip.sha256
            dist/build-manifest.json
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: artifacts/ci/
  build-macos:
    name: Build the macOS app
    needs: [plan, validate]
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/macos.yml
  publish:
    name: Publish v${{ needs.plan.outputs.version }}
    needs: [plan, build, build-macos]
    if: needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release-${{ github.run_id }}'
          merge-multiple: true
          path: release-files
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Re-verify the exact files, then publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_artifacts.py publish --directory release-files
